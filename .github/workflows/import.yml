name: Import standalone sprite-postprocess tool
on:
  push:
    branches: [migration/import-tool-20261031]
permissions:
  contents: write
jobs:
  import:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Copy precisely the reviewed standalone snapshot
        run: |
          set -euo pipefail
          git clone --depth 1 --single-branch --branch migration/sprite-postprocess-standalone-20261031 https://github.com/rickymusu-bit/quiz.git /tmp/sprite-source
          test "$(git -C /tmp/sprite-source rev-parse HEAD)" = '1783ea86087503e2624fd0c244bf0066095115ff'
          rsync -a --exclude='.git' /tmp/sprite-source/ ./
          rm -f .github/workflows/import.yml
          test -f scripts/sprite_postprocess.py
          test -f tests/fixtures/example-creature/source-sheet.png
          test -f .github/workflows/ci.yml
          echo 'Snapshot copied and source commit verified.'
      - name: Validate Python core
        run: |
          python -m pip install -r requirements-test.txt
          python -m unittest discover -s tests -p 'test_sprite*.py' -v
      - name: Validate browser editor and masked-patch workflows
        run: |
          python -m playwright install --with-deps chromium
          python tests/sprite_editor_browser.py
          python tests/sprite_local_edits_browser.py
          python tests/sprite_patches_browser.py
          python tests/sprite_patch_workflow_browser.py
      - name: Commit verified standalone files to migration branch
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore: import standalone sprite postprocessor from pinned Hellscape snapshot'
          git push origin HEAD:migration/import-tool-20261031
